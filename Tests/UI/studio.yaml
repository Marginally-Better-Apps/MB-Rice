appId: app.marginallybetter.rice
---
- launchApp
- assertVisible: "Library"
- tapOn: "Create"
- assertVisible: "Widgets"
- assertVisible: "Wallpaper"
- assertVisible: "Icon"
- tapOn: "Widgets"
- assertVisible: "Tap an element to edit it. Drag it to move it."
- tapOn: "Add element"
- tapOn: "Text"
- assertVisible: "Remove element"
- swipe:
    start: "50%,29%"
    end: "68%,34%"
    duration: 700
- takeScreenshot: "widget-selected-redesign"
- tapOn: "Save theme"
- assertVisible: "Save to Library"
- tapOn: "Save"
- back
- tapOn: "Library"
- assertVisible: "My Themes"
- assertVisible: "My Paper"
- tapOn: "My Paper"
- assertVisible: "Saved in Library"
- assertVisible: "Your text"
